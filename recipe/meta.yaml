{% set name = "itslive" %}
{% set version = "0.6.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/itslive-{{ version }}.tar.gz
  sha256: c26b89bf239b4941118353ac833cc401e1f8c78f41f9b09a315be2e4a0f8df36

build:
  entry_points:
    - itslive-export = itslive.cli.export:export
    - itslive-plot = itslive.cli.plot:plot
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - poetry-core >=1.0.0
    - pip
  run:
    - boto3 >=1.28
    - h3-py >=4.0
    - pyarrow >=10
    - pystac-client >=0.7
    - python-duckdb >=0.8
    - rustac >=0.6
    - python >={{ python_min }}
    - shapely >=2.0
    - matplotlib-base >=3.6
    - pandas >=1.5
    - plotext >=0
    - pyproj >=3.4
    - requests >=2.28
    - rich-click >=1.5
    - s3fs >=2022.3
    - tabulate >=0.9
    - xarray >=2022.6
    - zarr >=2.12
    - earthaccess >=0.5
    - pqdm >=0.2

test:
  imports:
    - itslive
  commands:
    - pip check
    - itslive-export --help
    - itslive-plot --help
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/nasa-jpl/itslive-py
  dev_url: https://github.com/nasa-jpl/itslive-py
  summary: Python client for ITSLIVE glacier velocity data.
  license: GPL-3.0-only
  license_file: LICENSE

extra:
  recipe-maintainers:
    - weiji14
    - betolink
    - jhkennedy
